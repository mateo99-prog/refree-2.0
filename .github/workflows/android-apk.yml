name: Build RefFlow Android

on:
  push:
    branches:
      - android-apk-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned APK and app bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect Android signing tools
        run: |
          BUILD_TOOLS_DIR="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p android-artifact/signing-tools/lib
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-artifact/RefFlow-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab android-artifact/RefFlow-unsigned.aab
          cp "$BUILD_TOOLS_DIR/zipalign" android-artifact/signing-tools/
          cp "$BUILD_TOOLS_DIR/apksigner" android-artifact/signing-tools/
          cp "$BUILD_TOOLS_DIR/lib/apksigner.jar" android-artifact/signing-tools/lib/

      - name: Publish transfer chunks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C android-artifact -czf /tmp/refflow-android-output.tar.gz .
          mkdir -p /tmp/refflow-android-output
          base64 -w 0 /tmp/refflow-android-output.tar.gz | split -b 500000 -d -a 3 --additional-suffix=.b64 - /tmp/refflow-android-output/part-
          sha256sum /tmp/refflow-android-output.tar.gz > /tmp/refflow-android-output/SHA256SUMS.txt
          cd /tmp/refflow-android-output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b android-apk-output
          git add .
          git commit -m "Publish Android build ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin android-apk-output

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: refflow-android-unsigned
          path: android-artifact
          if-no-files-found: error
          retention-days: 7
